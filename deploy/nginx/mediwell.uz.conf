# Mediwell panel + API — /etc/nginx/sites-available/mediwell.uz
# Avval faqat 80-port. SSL (443) blokini certbot o'zi qo'shadi:
#   sudo certbot --nginx -d mediwell.uz -d www.mediwell.uz --redirect
#
#   /      -> /var/www/mediwell-panel (Vue build, SPA)   — basic auth bilan yopiq
#   /api/  -> http://127.0.0.1:5048/  (prefiks olinadi)   — basic auth YO'Q, API o'zi JWT bilan himoyalangan
#            (panel so'rovlari "Authorization: Bearer" yuboradi, basic auth bilan to'qnashadi)

server {
    listen 80;
    listen [::]:80;
    server_name mediwell.uz www.mediwell.uz;

    # www -> mediwell.uz (certbot bu blokni 443 ga ko'chirganda ham ishlaydi)
    if ($host = www.mediwell.uz) {
        return 301 $scheme://mediwell.uz$request_uri;
    }

    root /var/www/mediwell-panel;
    index index.html;

    client_max_body_size 20m;

    # Vaqtinchalik himoya: panelga kirishdan oldin login/parol
    auth_basic "Mediwell";
    auth_basic_user_file /etc/nginx/.htpasswd-mediwell;

    # Xavfsizlik sarlavhalari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Siqish
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Let's Encrypt tekshiruvi — parolsiz
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        default_type text/plain;
    }

    # API -> .NET (systemd: mediwell-api)
    location /api/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:5048/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite build fayllari (nomida hash bor) — uzoq kesh
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html har doim yangisi olinsin (yangi deploy darhol ko'rinsin)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA: /admin/sklad/qoldiq kabi marshrutlar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }
}
